name: Build Fixed APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "y" | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses >/dev/null 2>&1 || true

      - name: Accept Android SDK licenses
        run: |
          yes 2>/dev/null | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/usr/local/lib/android/sdk --licenses 2>&1 | grep -v "Warning:" || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Create dummy libraries
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          echo 'dummy lib' > app/src/main/jniLibs/arm64-v8a/libqemu.so
          echo 'dummy lib' > app/src/main/jniLibs/arm64-v8a/libqemuimg.so

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: kios-fixed-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create release APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk kios-fixed-release.apk
          echo "Fixed APK created: kios-fixed-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: kios-fixed-release
          path: kios-fixed-release.apk
          retention-days: 30